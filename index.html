<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>বারাকাহ ফাউন্ডেশন | Barakah Foundation</title>
    <meta name="description" content="বারাকাহ ফাউন্ডেশন একটি অলাভজনক ও দাওয়াহ মূলক সেবামূলক প্রতিষ্ঠান। দ্বীনি শিক্ষা ও মানবতার সেবায় নিবেদিত।" />
